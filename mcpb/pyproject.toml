# The MCP Bundle's dependency declaration — Claude Desktop's managed uv resolves
# and installs this at extension install time (server.type "uv": no bundled
# libs, no user Python). The pin follows the anafpy release; bump it together
# with manifest.json's "version" when cutting a release —
# tests/test_version.py enforces the agreement.
[project]
name = "anafpy-mcpb"
version = "0.9.0"
description = "MCP Bundle entry project for the anafpy MCP server"
requires-python = ">=3.12"
dependencies = ["anafpy[mcp]==0.9.0"]

# Dependency container only — never build/install this project itself.
[tool.uv]
package = false
